name: 'JaCoCo Report to PR Comment'
description: 'Add JaCoCo report to PR comment.'
inputs:
  token:
    description: 'GitHub token used to read PR data and create/update PR comments.'
    required: true
  paths:
    description: 'Newline-separated paths or glob patterns to JaCoCo XML reports. Defaults to **/jacoco.xml.'
    required: false
    default: '**/jacoco.xml'
  exclude-paths:
    description: 'Newline-separated paths or globs to exclude from scanning.'
    required: false
  global-thresholds:
    description: 'Global thresholds in format overall*changed-files-average.'
    required: false
    default: '0*0'
  report-thresholds-default:
    description: >
      Default thresholds applied at the report/group level when a group omits a threshold field.
      Format: overall*changed-files-average*per-changed-file (e.g. "75*60*0").
      global-thresholds is a separate evaluation pass and is never in this fallback chain.
    required: false
    default: '0*0*0'
  title:
    description: 'Title used for the PR comment body and comment update matching.'
    required: false
  pr-number:
    description: 'PR number.'
    required: false
    default: ''
  metric:
    description: 'Coverage metric used for evaluation: instruction, line, branch, complexity, method, or class.'
    required: false
    default: 'instruction'
  comment-level:
    description: 'Comment output level: none, minimal, full, changed, failed, or failed-or-changed.'
    required: false
    default: 'full'
  report-groups:
    description: >
      Define named report groups. When provided, paths can be omitted and groups define their own paths.
      YAML list; each entry: name (required), paths (required list of globs),
      thresholds (optional O*A*P string), baseline-paths (optional list).
    required: false
    default: ''
  skip-unchanged:
    description: 'If true, reports with no changed files are removed from comment rows.'
    required: false
    default: 'false'
  evaluate-unchanged:
    description: >
      Applies only when skip-unchanged is true.
      If true, filtered unchanged reports are still checked for overall threshold failures (result only, no comment rows).
      If false, filtered unchanged reports are excluded from both comment rows and threshold evaluation.
    required: false
    default: 'true'
  global-overall-scope:
    description: >
      Controls which reports contribute to the global overall coverage number when report-groups is configured.
      'all' (default): scans the top-level paths and includes every discovered report in the global overall,
      even if it is not assigned to any group. Reports outside all groups are included in the global number
      but do not appear in any group row.
      'groups-only': only reports matched by a group path pattern count toward global overall (previous behaviour before this input was introduced).
    required: false
    default: 'all'
  baseline-paths:
    description: 'Paths to JaCoCo baseline reports.'
    required: false
  update-comment:
    description: 'If true, update an existing action comment with the same title instead of creating a new one.'
    required: false
    default: 'true'
  pass-symbol:
    description: 'Symbol to represent pass status.'
    required: false
    default: '✅'
  fail-symbol:
    description: 'Symbol to represent fail status.'
    required: false
    default: '❌'
  fail-on-threshold:
    description: >
      Controls which threshold breaches fail the action.
      List input (comma- or newline-separated): overall, changed-files-average, per-changed-file, fail-unchanged.
      fail-unchanged applies when skip-unchanged is true and enforces overall checks for filtered reports.
      Leave empty to disable failing on threshold breaches.
    required: false
    default: 'overall,changed-files-average,per-changed-file'
  debug:
    description: 'Enable detail logging.'
    required: false
    default: 'false'

outputs:
  coverage-overall:
    description: 'Overall coverage percentage.'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.coverage-overall }}
  coverage-changed-files:
    description: 'Coverage percentage for changed files.'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.coverage-changed-files }}
  coverage-overall-passed:
    description: 'Overall coverage pass status. (True/False)'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.coverage-overall-passed }}
  coverage-changed-files-passed:
    description: 'Coverage for changed files pass status. (True/False)'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.coverage-changed-files-passed }}
  reports-coverage:
    description: 'Coverage for each report.'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.reports-coverage }}
  groups-coverage:
    description: 'Coverage for each report group.'
    value: ${{ steps.jacoco-report-to-pr-comment.outputs.groups-coverage }}

branding:
  icon: 'book-open'
  color: 'yellow'

runs:
  using: 'composite'
  steps:
    # The venv lives in $RUNNER_TEMP, not the caller's workspace. Its interpreter is passed to the Run step
    # as a step output. Run scripts contain no `${{ … }}` expressions: they use runner-provided env vars only.
    - name: Install Python dependencies
      id: setup
      run: |
        # Every python call runs with -I: the working directory is the caller's checkout, and -I keeps it off sys.path.
        # `python` first, so existing callers keep their interpreter; `python3` is the fallback (Homebrew, Debian/Ubuntu).
        minimal_required_version="3.11.0"
        python_cmd=""
        for python_candidate in python python3; do
          command -v "$python_candidate" >/dev/null 2>&1 || continue
          echo "Found $python_candidate: $("$python_candidate" -I --version 2>&1)"
          if "$python_candidate" -I -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
            python_cmd="$python_candidate"
            break
          fi
        done
        if [ -z "$python_cmd" ]; then
          if ! command -v python >/dev/null 2>&1 && ! command -v python3 >/dev/null 2>&1; then
            echo "::error::Neither python nor python3 is on PATH. Add an actions/setup-python step before this action."
            exit 1
          fi
          echo "::error::Python version is less than $minimal_required_version"
          exit 1
        fi
        echo "Current Python version: $("$python_cmd" -I --version 2>&1)"
        echo "Python version meets the minimum requirement of $minimal_required_version"

        # A new private dir per call: no stale bin/python after a Python switch, and no venv planted by an earlier step.
        venv_dir="$(mktemp -d "$RUNNER_TEMP/jacoco-report-venv.XXXXXX")"
        "$python_cmd" -I -m venv "$venv_dir"
        venv_python="$venv_dir/bin/python"
        echo "python=$venv_python" >> "$GITHUB_OUTPUT"
        "$venv_python" -I -m pip install -r "$GITHUB_ACTION_PATH/requirements.txt"
      shell: bash

    # Inputs reach main.py only through this step's env: never interpolate `${{ inputs.* }}` into a
    # `run:` script (shell injection) or write them to $GITHUB_ENV (leaks into the caller's later steps).
    # -B: no __pycache__ in the caller's checkout (-E ignores PYTHONDONTWRITEBYTECODE).
    # -E -s, not -I: -I implies -P, which drops main.py's directory from sys.path and breaks `import jacoco_report`.
    - name: Run JaCoCo Report to PR Comment
      id: jacoco-report-to-pr-comment
      env:
        JACOCO_REPORT_PYTHON: ${{ steps.setup.outputs.python }}
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_GLOBAL_THRESHOLDS: ${{ inputs.global-thresholds }}
        INPUT_REPORT_THRESHOLDS_DEFAULT: ${{ inputs.report-thresholds-default }}
        INPUT_TITLE: ${{ inputs.title }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_METRIC: ${{ inputs.metric }}
        INPUT_COMMENT_LEVEL: ${{ inputs.comment-level }}
        INPUT_REPORT_GROUPS: ${{ inputs.report-groups }}
        INPUT_SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        INPUT_EVALUATE_UNCHANGED: ${{ inputs.evaluate-unchanged }}
        INPUT_GLOBAL_OVERALL_SCOPE: ${{ inputs.global-overall-scope }}
        INPUT_BASELINE_PATHS: ${{ inputs.baseline-paths }}
        INPUT_UPDATE_COMMENT: ${{ inputs.update-comment }}
        INPUT_PASS_SYMBOL: ${{ inputs.pass-symbol }}
        INPUT_FAIL_SYMBOL: ${{ inputs.fail-symbol }}
        INPUT_FAIL_ON_THRESHOLD: ${{ inputs.fail-on-threshold }}
        INPUT_DEBUG: ${{ inputs.debug }}
      run: |
        "$JACOCO_REPORT_PYTHON" -B -E -s "$GITHUB_ACTION_PATH/main.py"
      shell: bash
