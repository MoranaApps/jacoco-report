# Keeps this repository's agentic setup up to date: weekly, it runs agd update and opens a pull request
# with the changes. Copied from https://zejnilovic.github.io/agd/guides/automatic-updates/, with checkout
# pinned to a commit SHA, and the commit made through the GraphQL API instead of git push: GitHub signs
# it, so the "All Branches Rules" signed-commits ruleset passes without an exception for the branch.
name: Update the agentic setup

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# bash -eo pipefail instead of the default bash -e, so a failing agd update isn't hidden by tee.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # A pinned agd release, and the SHA-256 of its agd file from the release's SHA256SUMS.
      AGD_VERSION: 0.5.1
      AGD_SHA256: 6c361845bb96b89af8193c57c0742cfabd96c773ae8b950ca3ea3128b5771457
      BRANCH: agd-update
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing pushes with git: the commit goes through the API with GH_TOKEN.
          persist-credentials: false
      - name: Install agd
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSLo "$HOME/.local/bin/agd" "https://github.com/Zejnilovic/agd/releases/download/v$AGD_VERSION/agd"
          echo "$AGD_SHA256  $HOME/.local/bin/agd" | sha256sum -c -
          chmod +x "$HOME/.local/bin/agd"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check for a newer setup
        id: check
        run: |
          code=0
          agd status --check || code=$?
          [ "$code" -le 1 ] || exit "$code"
          echo "due=$code" >> "$GITHUB_OUTPUT"
      - name: Update and open a pull request
        if: steps.check.outputs.due == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          agd update | tee "$RUNNER_TEMP/update.txt"
          # Only files this project edited are due, and the update leaves those alone.
          [ -n "$(git status --porcelain)" ] || exit 0
          # Every file the update added, changed or deleted, as JSON files: Linux limits one command-line
          # argument to 128 KiB, and a whole kit is larger, so the contents never go through arguments. They're
          # built before the branch moves, so a failure here leaves the branch and its pull request as they were.
          git add -A
          # shellcheck disable=SC2016 # sh -c and jq expand these, not this shell
          git diff --cached --no-renames --name-only --diff-filter=AM -z \
            | xargs -0 -r -I{} sh -c 'base64 -w0 < "$1" | tr -d "\n" | jq -Rs --arg p "$1" "{path:\$p,contents:.}"' _ {} \
            | jq -s . > "$RUNNER_TEMP/additions.json"
          # shellcheck disable=SC2016 # jq expands $p, not this shell
          git diff --cached --no-renames --name-only --diff-filter=D -z \
            | xargs -0 -r -I{} jq -n --arg p {} '{path:$p}' \
            | jq -s . > "$RUNNER_TEMP/deletions.json"
          # The branch restarts at the checked-out commit each run, as the force push did.
          base=$(git rev-parse HEAD)
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" -f sha="$base" -F force=true >/dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/heads/$BRANCH" -f sha="$base" >/dev/null
          fi
          # One commit through the API, which GitHub signs.
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg branch "$BRANCH" --arg oid "$base" \
            --arg headline "Update the agentic setup" --rawfile body "$RUNNER_TEMP/update.txt" \
            --slurpfile add "$RUNNER_TEMP/additions.json" --slurpfile del "$RUNNER_TEMP/deletions.json" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid, message: {headline: $headline, body: $body},
                fileChanges: {additions: $add[0], deletions: $del[0]}}}}' \
            | gh api graphql --input - >/dev/null
          # shellcheck disable=SC2016 # the backticks are Markdown code spans, not command substitution
          {
            echo 'The weekly `agd update` changed these files. Read the changes before you merge: they are instructions for agents.'
            echo
            echo '```text'
            cat "$RUNNER_TEMP/update.txt"
            echo '```'
            echo
            echo 'An `edited` line is a file this project changed, which the update left alone. Settle it after you merge, with `agd diff`, then `agd merge` or `agd reset`: the next run replaces this branch.'
          } > "$RUNNER_TEMP/body.md"
          pr=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "Update the agentic setup" --body-file "$RUNNER_TEMP/body.md"
          fi
