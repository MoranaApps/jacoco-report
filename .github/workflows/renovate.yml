# NOTE: This workflow expects that branch protection rules require all checks to pass before merging.
# Auto-merge will only occur if all required status checks and reviews are successful.

name: Renovate auto-merge
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  renovate:
    name: Auto-enable auto-merge for Renovate PRs
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'renovate[bot]' && github.repository == 'MoranaApps/jacoco-report'
    env:
      # The secrets context is not allowed in step-level `if:`, so expose it via env first.
      HAS_REVIEW_TOKEN: ${{ secrets.RENOVATE_REVIEW_TOKEN != '' }}
    steps:
      # Runtime dependency PRs (requirements.in, requirements.txt) always need a person to review and merge them.
      # The file list comes from the paginated REST endpoint: `gh pr view --json files` stops at 100 files. It is read
      # into a variable first, so a failed `gh` call fails this step and nothing merges.
      - name: Check for runtime dependency changes
        id: runtime-gate
        run: |
          files="$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          [ -n "$files" ] || { echo "::error::Could not read the PR's changed files."; exit 1; }
          if grep -qxE 'requirements\.(in|txt)' <<< "$files"; then
            echo "runtime-changed=true" >> "$GITHUB_OUTPUT"
            echo "Skipping approval and auto-merge: runtime dependencies (requirements.in/requirements.txt) need a person to review and merge."
          else
            echo "runtime-changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve Renovate PR (optional PAT)
        if: ${{ env.HAS_REVIEW_TOKEN == 'true' && steps.runtime-gate.outputs.runtime-changed == 'false' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.RENOVATE_REVIEW_TOKEN }}

      - name: Skip approval (no review token configured)
        if: ${{ env.HAS_REVIEW_TOKEN != 'true' }}
        run: echo "Skipping PR approval. Configure RENOVATE_REVIEW_TOKEN to enable automated approvals."

      - name: Enable auto-merge for Renovate PR
        if: ${{ steps.runtime-gate.outputs.runtime-changed == 'false' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
