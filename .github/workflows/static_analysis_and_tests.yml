name: "Static analysis & tests"

on:
  push:
    branches: [ master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  context-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: CONTEXT.md check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check CONTEXT.md files are up to date
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .claude/skills/context-md/check.sh --base "origin/$BASE_REF" --strict

  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      oldest-version: ${{ steps.set-matrix.outputs.oldest-version }}
    steps:
      - id: set-matrix
        run: |
          echo "matrix={\"python-version\": [\"3.11\", \"3.12\", \"3.13\", \"3.14\", \"3.15\"]}" >> $GITHUB_OUTPUT
          echo "oldest-version=3.11" >> $GITHUB_OUTPUT

  analysis:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Pylint Analysis - (Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Analyze code with Pylint
        id: analyze-code
        run: |
          pylint_score=$(pylint $(git ls-files '*.py') | grep 'rated at' | awk '{print $7}' | cut -d'/' -f1)
          echo "score=$pylint_score" >> "$GITHUB_OUTPUT"

      - name: Check Pylint score
        env:
          PYLINT_SCORE: ${{ steps.analyze-code.outputs.score }}
        run: |
          if (( $(echo "$PYLINT_SCORE < 9.5" | bc -l) )); then
            echo "Failure: Pylint score is below 9.5 (project score: $PYLINT_SCORE)."
            exit 1
          else
            echo "Success: Pylint score is above 9.5 (project score: $PYLINT_SCORE)."
          fi

  code-format-check:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Black Format Check - (Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Check code format with Black
        id: check-format
        run: |
          black --check $(git ls-files '*.py')

  unit-tests:
    needs: set-matrix
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{fromJson(needs.set-matrix.outputs.matrix)}}
    name: Unit Tests - (Python ${{ matrix.python-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=. --cov-fail-under=80 --cov-report=html

  integration-tests:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Integration Tests - (Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          pytest tests/integration/ --ignore=tests/integration/live
          exit_code=$?; [ $exit_code -eq 5 ] && exit 0 || exit $exit_code

  live-integration-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    needs: set-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Live Integration Test - (Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Run live integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          pytest tests/integration/live/ -v
          exit_code=$?; [ $exit_code -eq 5 ] && exit 0 || exit $exit_code

  self-test:
    if: github.event_name == 'pull_request'
    needs: set-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
      pull-requests: read
    name: Action Self-Test - (${{ matrix.os }}, Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # comment-level none + update-comment false makes no comment API call, so this read-only
      # run also works on fork PRs, whose GITHUB_TOKEN cannot write.
      - name: Run the action from this checkout
        id: jacoco-report
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: |
            tests/data/test_project/module_large/jacoco.xml
            tests/data/test_project/context/**/jacoco.xml
          comment-level: none
          update-comment: 'false'
          # Hostile on purpose: if the title were ever shell-expanded, the marker file would be created.
          title: 'x $(touch "$RUNNER_TEMP/jacoco-pwned") `touch "$RUNNER_TEMP/jacoco-pwned"` "y"'

      # Expected values follow from the fixture XMLs in `paths`; update them when those fixtures change.
      - name: Assert action outputs
        env:
          COVERAGE_OVERALL: ${{ steps.jacoco-report.outputs.coverage-overall }}
          COVERAGE_CHANGED_FILES: ${{ steps.jacoco-report.outputs.coverage-changed-files }}
          COVERAGE_OVERALL_PASSED: ${{ steps.jacoco-report.outputs.coverage-overall-passed }}
          COVERAGE_CHANGED_FILES_PASSED: ${{ steps.jacoco-report.outputs.coverage-changed-files-passed }}
          REPORTS_COVERAGE: ${{ steps.jacoco-report.outputs.reports-coverage }}
          GROUPS_COVERAGE: ${{ steps.jacoco-report.outputs.groups-coverage }}
        run: |
          failed=0
          check() {
            if [ "$3" = "$2" ]; then
              echo "OK: $1 = $3"
            else
              echo "::error::$1: expected '$2', got '$3'"
              failed=1
            fi
          }
          check coverage-overall 91.62 "$COVERAGE_OVERALL"
          check coverage-changed-files 0.0 "$COVERAGE_CHANGED_FILES"
          check coverage-overall-passed True "$COVERAGE_OVERALL_PASSED"
          check coverage-changed-files-passed True "$COVERAGE_CHANGED_FILES_PASSED"
          check "reports-coverage entries" 8 "$(jq length <<< "$REPORTS_COVERAGE")"
          check groups-coverage '{}' "$(jq -c . <<< "$GROUPS_COVERAGE")"
          check hostile-title-not-expanded absent "$(if [ -e "$RUNNER_TEMP/jacoco-pwned" ]; then echo present; else echo absent; fi)"
          exit $failed

  mypy-check:
    needs: set-matrix
    runs-on: ubuntu-latest
    name: Mypy Type Check - (Python ${{ needs.set-matrix.outputs.oldest-version }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ needs.set-matrix.outputs.oldest-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt
      - name: Check types with Mypy
        id: check-types
        run: |
          mypy .
